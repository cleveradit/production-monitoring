services:
  app:
    build:
      context: ./docker/php
    container_name: pm-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      node:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: pm-nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: pm-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: manufacturing_test
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
      TZ: Asia/Jakarta
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./database/dataset.sql:/docker-entrypoint-initdb.d/01-dataset.sql:ro
    healthcheck:
      # TCP ping: the temporary init server runs with --skip-networking,
      # so this only passes after the dataset import has finished.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  node:
    image: node:22-alpine
    container_name: pm-node
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm ci --no-audit --no-fund && npm run build"

volumes:
  db-data:
